name: release
on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "CHANGELOG.md", "docs/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - name: 구글 캘린더 키 넣기 (Secrets에 있으면)
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || '160366740612-ng34jo8ervjdh89ge3b6lqc3amunfhn9.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ($env:GOOGLE_CLIENT_SECRET) { @{ clientId = $env:GOOGLE_CLIENT_ID; clientSecret = $env:GOOGLE_CLIENT_SECRET } | ConvertTo-Json | Set-Content -Encoding utf8 creds.json; Write-Host "creds ok" } else { Write-Host "GOOGLE_CLIENT_SECRET 없음 - 캘린더 키 없이 빌드" }
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 릴리스 설명에 바뀐 점 넣기 (CHANGELOG.md)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $t = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($t, "(?ms)^## " + [regex]::Escape($v) + "\s*\r?\n(.*?)(?=^## |\z)")
          $body = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          $body = $body -replace "(?m)^### ", "## "
          $foot = "`n`n---`n**설치**: 아래 Assets에서 ``RamGroupTalk-Setup-$v.exe``를 받아 실행해요. 이미 쓰고 있다면 자동으로 업데이트돼요.`n`n[사용 방법](https://github.com/dpfkadpfka/RamGroupTalk#readme) · [전체 바뀐 점](https://github.com/dpfkadpfka/RamGroupTalk/blob/main/CHANGELOG.md)"
          Set-Content -Path notes.md -Value ($body + $foot) -Encoding utf8
          gh release edit "v$v" --title "RamGroupTalk $v" --notes-file notes.md
